name: Validar Terraform

on:
  push:
    branches:
      - main
    paths:
      - "foundation/terraform/**"
      - "clusters/sandbox/terraform/**"
      - ".github/workflows/validate-terraform.yml"

  pull_request:
    paths:
      - "foundation/terraform/**"
      - "clusters/sandbox/terraform/**"
      - ".github/workflows/validate-terraform.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        directory:
          - foundation/terraform
          - clusters/sandbox/terraform

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.directory }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Comprobar formato
        run: terraform fmt -check

      - name: Inicializar sin acceder al estado
        run: terraform init -backend=false -lockfile=readonly

      - name: Validar configuracion
        run: terraform validate

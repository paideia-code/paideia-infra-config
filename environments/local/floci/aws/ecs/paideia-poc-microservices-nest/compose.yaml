name: paideia-poc-microservices-nest-local-aws-infra

services:
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:7001-7010:7001-7010"
      - "127.0.0.1:28080:80"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_DOCKER_NETWORK: paideia-poc-microservices-nest-local-aws-network
      FLOCI_SERVICES_RDS_MOCK: "false"
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: localhost
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7010"
      FLOCI_SERVICES_ECR_URI_STYLE: path
      FLOCI_SERVICES_UI_ENABLED: "false"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  stackport:
    image: davireis/stackport:latest
    ports:
      - "127.0.0.1:20800:8080"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: "${AWS_REGION:?Configura AWS_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?Configura AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?Configura AWS_SECRET_ACCESS_KEY}"
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - stackport-data:/root/.stackport

volumes:
  floci-data:
  stackport-data:

networks:
  default:
    name: paideia-poc-microservices-nest-local-aws-network

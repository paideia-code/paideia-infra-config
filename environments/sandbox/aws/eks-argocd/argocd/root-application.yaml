apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-applications
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/paideia-code/paideia-infra-config.git
    targetRevision: main
    path: environments/sandbox/aws/eks-argocd/applications
    directory:
      recurse: true
      include: "**/application.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false

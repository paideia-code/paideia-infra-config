name: Levantar sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paideia-sandbox-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: paideia-code/paideia-infra-automations/.github/workflows/aws-check-identity.yml@v0.6.0
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      expected-principal-arn: arn:aws:iam::689060328245:user/paideia-github-actions-sandbox-operator
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_SANDBOX_OPERATOR_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SANDBOX_OPERATOR_SECRET_ACCESS_KEY }}

  up:
    needs: verify
    uses: paideia-code/paideia-infra-automations/.github/workflows/eks-up.yml@v0.7.1
    with:
      cluster-directory: clusters/sandbox
      cluster-name: paideia-code-sandbox
      aws-region: ${{ vars.AWS_REGION }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      admin-cidr: ${{ vars.SANDBOX_ADMIN_CIDR }}
      terraform-version: "1.17.1"
      helm-version: "4.3.1"
      kubectl-version: "1.36.1"
      argocd-chart-version: "10.17.0"
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_SANDBOX_OPERATOR_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SANDBOX_OPERATOR_SECRET_ACCESS_KEY }}
